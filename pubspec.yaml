name: anxiety_mobile_app

description: >
  A research-focused mobile application designed to collect behavioral and contextual data from consenting users to support anxiety-related studies. 
  The app gathers data such as location, call and SMS logs, app usage, battery status, screen activity, and sensor signals, which are securely transmitted 
  to a server for analysis.

  This application is strictly intended for academic and research purposes only and is not designed for production use. 
  It may be unstable and subject to changes. By using this app, users provide informed consent for data collection and acknowledge that the app is provided 
  "as is" without warranties of any kind. The developers are not liable for any damages or data loss resulting from its use.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2
  geolocator: ^12.0.0
  call_log: ^4.0.0
  usage_stats: ^1.3.0
  flutter_sms_inbox: ^1.0.4
  http: ^1.2.0
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  screen_state: ^4.0.0
  sensors_plus: ^4.0.0
  permission_handler: ^11.3.0

  battery_plus: ^6.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
