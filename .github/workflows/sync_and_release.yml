name: Sync and Release (Main)

on:
  push:
    branches: [ main ]

jobs:
  sync:
    name: Sync to Research Repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Research Repository via PR
        env:
          RESEARCH_REPO_PAT: ${{ secrets.RESEARCH_REPO_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the research repo securely
          git clone https://x-access-token:${RESEARCH_REPO_PAT}@github.com/dulhara79/R26-DS-012.git research-repo
          cd research-repo
          
          SYNC_BRANCH="sync/anxiety-mobile-app"
          
          # Fetch remote branches. Check out the sync branch if it exists, otherwise create it.
          git fetch origin
          if git ls-remote --exit-code --heads origin $SYNC_BRANCH; then
            echo "Branch exists remotely. Checking out..."
            git checkout $SYNC_BRANCH
          else
            echo "Branch does not exist. Creating new branch from main..."
            git checkout -b $SYNC_BRANCH
          fi
          
          # Ensure target directory exists
          mkdir -p apps/anxiety_mobile_app
          
          # Move back to workspace root to run rsync safely
          cd ..
          
          # Sync files. 
          # CRITICAL: We explicitly exclude 'research-repo' to prevent an infinite recursive copy!
          rsync -av --delete \
            --exclude 'research-repo' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.idea' \
            --exclude 'build' \
            --exclude '.dart_tool' \
            --exclude '*.jks' \
            --exclude 'android/key.properties' \
            --exclude '.env' \
            ./ research-repo/apps/anxiety_mobile_app/
          
          # Commit and push
          cd research-repo
          git add apps/anxiety_mobile_app/
          
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "chore(sync): Update anxiety_mobile_app from development repo (commit ${{ github.sha }})"
            
            # Push updates to the sync branch
            git push origin $SYNC_BRANCH
            
            # Check if a PR already exists for this branch
            export GH_TOKEN=$RESEARCH_REPO_PAT
            PR_EXISTS=$(gh pr list --head $SYNC_BRANCH --json number --jq '.[0].number' --repo dulhara79/R26-DS-012)
            
            if [ -z "$PR_EXISTS" ]; then
              echo "No open PR found. Creating a new Pull Request..."
              gh pr create \
                --title "Sync: Update Anxiety Mobile App Code" \
                --body "Automated update of the mobile app code from the development repository. Source commit: ${{ github.sha }}" \
                --base main \
                --head $SYNC_BRANCH \
                --repo dulhara79/R26-DS-012
            else
              echo "Pull Request #$PR_EXISTS already exists. New commits have been automatically added to it."
            fi
          fi

  build:
    name: Validate and Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Build validation APK
        run: flutter build apk --debug

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: validation-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Require Android release signing and backend configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BACKEND_BASE: ${{ secrets.BACKEND_BASE }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ] && \
             printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks 2>/dev/null && \
             [ -s android/app/upload-keystore.jks ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && \
             [[ "$BACKEND_BASE" == https://* ]]; then
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
          else
            rm -f android/app/upload-keystore.jks android/key.properties
            echo "Release signing or BACKEND_BASE configuration is incomplete. Refusing production release."
            exit 1
          fi

      - name: Build signed production APK and AAB
        env:
          BACKEND_BASE: ${{ secrets.BACKEND_BASE }}
        run: |
          flutter build apk --release --obfuscate --split-debug-info=./debug-info \
            --dart-define=BACKEND_BASE="$BACKEND_BASE"
          
          flutter build appbundle --release --obfuscate --split-debug-info=./debug-info \
            --dart-define=BACKEND_BASE="$BACKEND_BASE"

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Report signed release
        run: echo "Signed release APK and AAB were built with BACKEND_BASE." >> "$GITHUB_STEP_SUMMARY"
          fi
