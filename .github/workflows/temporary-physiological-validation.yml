name: Temporary physiological validation

on:
  pull_request:
    branches: [main]

jobs:
  physiological:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check physiological formatting
        run: >
          dart format --output=none --set-exit-if-changed
          lib/services/chest_strap_service.dart
          lib/pages/home_page.dart
          lib/pages/dashboard_page.dart
          lib/pages/baseline_calibration_page.dart
          test/chest_strap_contract_test.dart

      - name: Analyze physiological files
        run: >
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/services/chest_strap_service.dart
          lib/pages/home_page.dart
          lib/pages/dashboard_page.dart
          lib/pages/baseline_calibration_page.dart
          test/chest_strap_contract_test.dart

      - name: Run simulator contract tests
        run: flutter test test/chest_strap_contract_test.dart
