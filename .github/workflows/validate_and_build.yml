name: Validate and Test (PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check changed-file formatting
        run: dart format --output=none --set-exit-if-changed lib/pages/login_page.dart lib/services/demo_auth_service.dart test/demo_static_auth_test.dart

      - name: Analyze changed auth files
        run: flutter analyze lib/pages/login_page.dart lib/services/demo_auth_service.dart test/demo_static_auth_test.dart --fatal-infos --fatal-warnings

      - name: Run full test suite
        run: flutter test