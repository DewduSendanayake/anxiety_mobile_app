name: Validate and Test (PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check changed-file formatting
        run: dart format --output=none --set-exit-if-changed lib/pages/login_page.dart lib/services/demo_auth_service.dart test/demo_static_auth_test.dart

      - name: Analyze changed auth files
        run: flutter analyze lib/pages/login_page.dart lib/services/demo_auth_service.dart test/demo_static_auth_test.dart --fatal-infos --fatal-warnings

      - name: Test static demo auth
        continue-on-error: true
        run: flutter test test/demo_static_auth_test.dart

      - name: Test auth validators
        continue-on-error: true
        run: flutter test test/auth_validators_test.dart

      - name: Test chest strap contract
        continue-on-error: true
        run: flutter test test/chest_strap_contract_test.dart

      - name: Test forecast message policy
        continue-on-error: true
        run: flutter test test/forecast_message_policy_test.dart

      - name: Test fusion risk service
        continue-on-error: true
        run: flutter test test/fusion_risk_service_test.dart

      - name: Test participant ID page
        continue-on-error: true
        run: flutter test test/share_participant_id_page_test.dart

      - name: Test startup safety
        continue-on-error: true
        run: flutter test test/startup_safety_test.dart

      - name: Test theme schedule
        continue-on-error: true
        run: flutter test test/theme_schedule_test.dart

      - name: Test widget smoke
        continue-on-error: true
        run: flutter test test/widget_test.dart