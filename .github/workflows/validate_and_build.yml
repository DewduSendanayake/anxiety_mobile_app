name: Validate and Test (PR)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: |
          dart format lib/pages/login_page.dart lib/services/demo_auth_service.dart test/demo_static_auth_test.dart
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/pages/login_page.dart lib/services/demo_auth_service.dart test/demo_static_auth_test.dart
            git commit -m "style: format static patient login"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test