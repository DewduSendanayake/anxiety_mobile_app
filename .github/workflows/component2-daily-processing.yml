name: Component 2 Daily Processing

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Component 2 dependencies
        run: pip install -r component2_backend/requirements.txt

      - name: Process completed behavioural days
        env:
          SUPABASE_URL: ${{ secrets.COMPONENT2_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.COMPONENT2_SUPABASE_SERVICE_ROLE_KEY }}
          COMPONENT2_TIMEZONE: Asia/Colombo
        run: python component2_backend/run_daily.py
